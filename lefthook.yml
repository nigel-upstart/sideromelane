pre-commit:
  parallel: false
  commands:
    fmt:
      run: cargo fmt --all -- --check
    lint:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    test:
      run: cargo test --workspace --all-features

pre-push:
  parallel: false
  commands:
    check:
      run: just check
    audit:
      run: just audit

