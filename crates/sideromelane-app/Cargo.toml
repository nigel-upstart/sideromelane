[package]
name                   = "sideromelane-app"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "Native macOS desktop app shell for Sideromelane."
readme                 = "../../README.md"
keywords               = ["desktop", "local", "macos", "markdown"]
categories             = ["gui", "text-editors"]

[[bin]]
name = "sideromelane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dirs              = "6"
eframe            = "0.34.2"
egui_commonmark   = "0.23.0"
rfd               = "0.17.2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
sideromelane-core = { path = "../sideromelane-core", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.10"
